<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List | StreamFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">STREAM<span>FLIX</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="mylist.html" class="active">My List</a>
    </nav>

    <div class="nav-actions">
        <button onclick="toggleTheme()">☀</button>
    </div>
</header>

<section class="content-section" style="padding-top:120px;">

    <div class="section-title">
        <h2>❤️ My List</h2>
    </div>

    <div class="content-row" id="listContainer"></div>

</section>

<script src="script.js"></script>

<script>

const list =
    JSON.parse(
        localStorage.getItem("streamflixList")
    ) || [];

const container =
    document.getElementById("listContainer");

if (list.length === 0) {

    container.innerHTML = `
        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:80px 20px;
            color:#aaa;
        ">
            <div style="font-size:60px;">❤️</div>
            <h2 style="color:white;margin:20px;">
                Your list is empty
            </h2>
            <p>
                Add movies from the Movies page.
            </p>
            <br>
            <a href="movies.html"
               class="watch-btn"
               style="display:inline-block;">
                Explore Movies
            </a>
        </div>
    `;

} else {

    list.forEach(function(movie, index) {

        const colors = [
            "tile-red",
            "tile-blue",
            "tile-purple",
            "tile-orange"
        ];

        const tile =
            document.createElement("div");

        tile.className = "movie-tile";

        tile.innerHTML = `
            <div class="tile-poster ${colors[index % 4]}"></div>

            <h3>${movie}</h3>

            <button onclick="watchMovie('${movie}')">
                ▶ Watch
            </button>

            <button onclick="removeFromList('${movie}')">
                ✕ Remove
            </button>
        `;

        container.appendChild(tile);
    });
}

</script>

</body>
</html>
