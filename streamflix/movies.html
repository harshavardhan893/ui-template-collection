<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | StreamFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">STREAM<span>FLIX</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="mylist.html">My List</a>
    </nav>

    <div class="nav-actions">
        <button onclick="toggleTheme()">☀</button>
    </div>
</header>

<section class="content-section" style="padding-top:120px;">

    <div class="section-title">
        <h2>🎬 Explore Movies</h2>
    </div>

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Search movies..."
        onkeyup="searchMovies()"
        style="
            width:100%;
            max-width:600px;
            padding:15px;
            margin-bottom:30px;
            background:#171717;
            color:white;
            border:1px solid rgba(255,255,255,.15);
            border-radius:7px;
            font-size:16px;
        "
    >

    <div class="content-row" id="movieGrid">

        <div class="movie-tile movie-item">
            <div class="tile-poster tile-red"></div>
            <h3>The Last Horizon</h3>
            <button onclick="watchMovie('The Last Horizon')">▶ Watch</button>
            <button onclick="addToList('The Last Horizon')">＋ List</button>
        </div>

        <div class="movie-tile movie-item">
            <div class="tile-poster tile-blue"></div>
            <h3>Beyond Earth</h3>
            <button onclick="watchMovie('Beyond Earth')">▶ Watch</button>
            <button onclick="addToList('Beyond Earth')">＋ List</button>
        </div>

        <div class="movie-tile movie-item">
            <div class="tile-poster tile-purple"></div>
            <h3>The Silent Voice</h3>
            <button onclick="watchMovie('The Silent Voice')">▶ Watch</button>
            <button onclick="addToList('The Silent Voice')">＋ List</button>
        </div>

        <div class="movie-tile movie-item">
            <div class="tile-poster tile-orange"></div>
            <h3>Lost Kingdom</h3>
            <button onclick="watchMovie('Lost Kingdom')">▶ Watch</button>
            <button onclick="addToList('Lost Kingdom')">＋ List</button>
        </div>

        <div class="movie-tile movie-item">
            <div class="tile-poster poster-two"></div>
            <h3>Shadow City</h3>
            <button onclick="watchMovie('Shadow City')">▶ Watch</button>
            <button onclick="addToList('Shadow City')">＋ List</button>
        </div>

    </div>

</section>

<script src="script.js"></script>

<script>
function searchMovies() {

    const value =
        document.getElementById("searchInput")
        .value.toLowerCase();

    document.querySelectorAll(".movie-item")
        .forEach(function(movie) {

            const title =
                movie.querySelector("h3")
                .textContent.toLowerCase();

            movie.style.display =
                title.includes(value) ? "block" : "none";
        });
}
</script>

</body>
</html>
