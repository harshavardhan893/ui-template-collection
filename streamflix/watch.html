<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch | StreamFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">STREAM<span>FLIX</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="mylist.html">My List</a>
    </nav>
</header>

<section style="padding-top:100px;">

    <div style="
        width:90%;
        max-width:1100px;
        margin:auto;
        aspect-ratio:16/9;
        background:
        linear-gradient(135deg,#32070b,#050505);
        border-radius:10px;
        display:flex;
        align-items:center;
        justify-content:center;
        position:relative;
        overflow:hidden;
    ">

        <button
            onclick="playVideo()"
            style="
                width:80px;
                height:80px;
                border-radius:50%;
                border:none;
                background:#e50914;
                color:white;
                font-size:30px;
            "
        >
            ▶
        </button>

        <div style="
            position:absolute;
            bottom:25px;
            left:30px;
        ">
            <p style="color:#aaa;">NOW PLAYING</p>
            <h1 id="movieTitle">The Last Horizon</h1>
        </div>

    </div>

    <div style="
        width:90%;
        max-width:1100px;
        margin:30px auto 80px;
    ">

        <h1 id="movieHeading">The Last Horizon</h1>

        <p style="
            color:#aaa;
            line-height:1.7;
            max-width:700px;
            margin-top:15px;
        ">
            Enjoy this cinematic experience on StreamFlix.
            This watch page demonstrates a modern streaming
            interface with interactive controls.
        </p>

        <div style="margin-top:25px;">
            <button
                class="watch-btn"
                onclick="addCurrentToList()"
            >
                ❤️ Add to My List
            </button>

            <a
                href="movies.html"
                class="info-btn"
                style="display:inline-block;margin-left:10px;"
            >
                ← Back to Movies
            </a>
        </div>

    </div>

</section>

<div id="toast"></div>

<script src="script.js"></script>

<script>

const selected =
    localStorage.getItem("selectedShow") ||
    "The Last Horizon";

document.getElementById("movieTitle").textContent =
    selected;

document.getElementById("movieHeading").textContent =
    selected;

function playVideo() {

    showToast("▶ Playing " + selected);

}

function addCurrentToList() {

    addToList(selected);

}

</script>

</body>
</html>
