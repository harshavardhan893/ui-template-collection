<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickBite | Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
    <div class="grid"></div>
</div>

<div class="cursor-glow"></div>


<header class="header">

    <div class="logo">
        🍔 Quick<span style="color:#ff5a1f">Bite</span>
    </div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="cart.html" class="active">
            Cart <span id="cartCount">0</span>
        </a>
        <a href="orders.html">Orders</a>
    </nav>

    <div class="header-actions">
        <button class="theme-btn" id="themeBtn">🌙</button>
        <button class="profile-btn" onclick="showLogin()">👤</button>
    </div>

</header>


<main>

<section class="section" style="padding-top:50px">

    <span class="small-title">YOUR ORDER</span>

    <h1 style="font-size:clamp(40px,6vw,65px);margin:10px 0 30px">
        Your Cart 🛒
    </h1>


    <div
        id="cartItems"
        style="
        display:grid;
        gap:15px;
        "
    ></div>


    <div
        id="cartSummary"
        style="
        margin-top:30px;
        padding:30px;
        border:1px solid var(--border);
        border-radius:22px;
        background:rgba(255,255,255,.05);
        "
    ></div>

</section>

</main>


<footer>

    <div class="footer-logo">🍔 QuickBite</div>

    <p>Delicious food. Delivered with love.</p>

</footer>


<script src="script.js"></script>

<script>

function renderCart() {

    const cart =
        JSON.parse(
            localStorage.getItem("quickbiteCart")
        ) || [];

    const container =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("cartSummary");

    if (cart.length === 0) {

        container.innerHTML = `
            <div style="
                padding:50px;
                text-align:center;
                border:1px solid var(--border);
                border-radius:20px;
                background:rgba(255,255,255,.04);
            ">
                <div style="font-size:70px">🛒</div>

                <h2>Your cart is empty</h2>

                <p style="
                    color:var(--muted);
                    margin:12px 0 20px;
                ">
                    Add delicious food to get started.
                </p>

                <a
                    href="restaurants.html"
                    class="primary-btn"
                >
                    Browse Restaurants
                </a>
            </div>
        `;

        summary.innerHTML = "";

        return;
    }


    container.innerHTML = cart.map((item,index) => `

        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            padding:20px;
            border:1px solid var(--border);
            border-radius:18px;
            background:rgba(255,255,255,.05);
            flex-wrap:wrap;
        ">

            <div style="
                display:flex;
                align-items:center;
                gap:15px;
            ">

                <div style="
                    font-size:45px;
                    width:70px;
                    height:70px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:rgba(255,90,31,.1);
                    border-radius:15px;
                ">
                    🍽️
                </div>

                <div>
                    <h3>${item.name}</h3>

                    <p style="
                        color:var(--muted);
                        margin-top:5px;
                    ">
                        ₹${item.price} each
                    </p>
                </div>

            </div>


            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">

                <button
                    onclick="changeQuantity(${index},-1)"
                    style="
                    width:35px;
                    height:35px;
                    border:1px solid var(--border);
                    background:rgba(255,255,255,.07);
                    color:white;
                    border-radius:8px;
                    cursor:pointer;
                    "
                >−</button>

                <strong>${item.quantity}</strong>

                <button
                    onclick="changeQuantity(${index},1)"
                    style="
                    width:35px;
                    height:35px;
                    border:1px solid var(--border);
                    background:rgba(255,255,255,.07);
                    color:white;
                    border-radius:8px;
                    cursor:pointer;
                    "
                >+</button>

            </div>


            <strong style="font-size:18px">
                ₹${item.price * item.quantity}
            </strong>


            <button
                onclick="removeItem(${index})"
                style="
                border:none;
                background:rgba(255,60,80,.12);
                color:#ff7181;
                padding:9px 12px;
                border-radius:9px;
                cursor:pointer;
                "
            >
                Remove
            </button>

        </div>

    `).join("");


    const subtotal =
        cart.reduce(
            (sum,item) =>
                sum + item.price * item.quantity,
            0
        );

    const delivery =
        subtotal >= 499 ? 0 : 40;

    const total =
        subtotal + delivery;


    summary.innerHTML = `

        <h2>Order Summary</h2>

        <div style="
            display:flex;
            justify-content:space-between;
            margin-top:20px;
            color:var(--muted);
        ">
            <span>Subtotal</span>
            <span>₹${subtotal}</span>
        </div>

        <div style="
            display:flex;
            justify-content:space-between;
            margin-top:12px;
            color:var(--muted);
        ">
            <span>Delivery</span>
            <span>
                ${delivery === 0 ? "FREE" : "₹40"}
            </span>
        </div>

        <hr style="
            margin:20px 0;
            border:none;
            border-top:1px solid var(--border);
        ">

        <div style="
            display:flex;
            justify-content:space-between;
            font-size:20px;
            font-weight:bold;
        ">
            <span>Total</span>
            <span>₹${total}</span>
        </div>

        <button
            class="primary-btn"
            onclick="checkout()"
            style="
            border:none;
            width:100%;
            margin-top:20px;
            "
        >
            Proceed to Checkout →
        </button>

    `;

}


function changeQuantity(index,change) {

    const cart =
        JSON.parse(
            localStorage.getItem("quickbiteCart")
        ) || [];

    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {
        cart.splice(index,1);
    }

    localStorage.setItem(
        "quickbiteCart",
        JSON.stringify(cart)
    );

    renderCart();

    if (typeof updateCartCount === "function") {
        updateCartCount();
    }

}


function removeItem(index) {

    const cart =
        JSON.parse(
            localStorage.getItem("quickbiteCart")
        ) || [];

    cart.splice(index,1);

    localStorage.setItem(
        "quickbiteCart",
        JSON.stringify(cart)
    );

    renderCart();

    updateCartCount();

    showToast("Item removed");

}


function checkout() {

    const cart =
        JSON.parse(
            localStorage.getItem("quickbiteCart")
        ) || [];

    if (cart.length === 0) {

        showToast("Your cart is empty");

        return;
    }

    localStorage.setItem(
        "quickbiteLastOrder",
        JSON.stringify({
            items: cart,
            date: new Date().toLocaleString(),
            status: "Preparing"
        })
    );

    localStorage.removeItem("quickbiteCart");

    updateCartCount();

    showToast("Order placed successfully! 🎉");

    setTimeout(() => {
        window.location.href = "orders.html";
    },1000);

}


renderCart();

</script>

</body>
</html>
